[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "ai-poc"
version = "0.1.0"
description = "Live AI inference endpoint with flexible model support."
requires-python = ">=3.10"
dependencies = ["torch (>=2.1.0)", "transformers (>=4.45.0)", "pillow (>=10.0.0)", "accelerate (>=0.26.0)", "huggingface-hub (>=0.24.0)"]


[tool.poetry]
packages = [{include = "handlers", from = "src"}, {include = "configs", from = "src"}, {include = "shims", from = "src"}, {include = "serving", from = "src"}]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "ANN"]
ignore = []

[tool.mypy]
python_version = "3.10"
disallow_untyped_defs = true
warn_return_any = true
warn_unused_configs = true

[dependency-groups]
dev = [
    "pytest (>=8.0.0)",
    "pytest-cov (>=4.1.0)",
    "ruff (>=0.4.0)",
    "mypy (>=1.10.0)"
]
merlin = [
    "monai (>=1.3.0)",
    "nibabel (>=5.0.0)",
    "einops (>=0.7.0)",
    "peft (>=0.10.0)",
    "sentencepiece (>=0.2.0)"
]
