[project]
name = "live-ai-inferenceservice"
version = "0.1.0"
description = "KServe inference endpoint for medical AI models."
authors = [
    {name = "thorpe7",email = "maxwell.thorpe7@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "kserve (>=0.17.0,<0.18.0)"
]


[dependency-groups]
dev = [
    "pytest (>=8.0.0)",
    "pytest-cov (>=4.1.0)",
    "ruff (>=0.4.0)",
    "mypy (>=1.10.0)"
]
vllm = [
    "vllm (>=0.19.0,<0.20.0)",
    "pillow (>=12.2.0,<13.0.0)",
    "pydicom (>=3.0.0,<4.0.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
