apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: totalseg
  namespace: xnat
  annotations:
    serving.kserve.io/scaleTarget: "3"
    serving.kserve.io/minReplicas: "0"
    serving.kserve.io/scaleMetric: "concurrency"
spec:
  predictor:
    nodeSelector:
      karpenter.sh/nodepool: gpu-ai
    tolerations:
      - key: nvidia.com/gpu
        operator: Equal
        value: "true"
        effect: NoSchedule
      - key: workload.type
        operator: Equal
        value: "ai"
        effect: NoSchedule
    containers:
      - name: totalseg
        image: maxwellthorpe/ai-poc-phase2-totalseg:0.0.2
        command:
          - "python3"
          - "entrypoint.py"
        args:
          - --handler_type
          - totalseg
          - --model_name
          - totalseg
          - --output_root
          - /data/xnat/archive/AI-POC/resources/output
          - --task_default
          - total
          - --fast_default
          - "true"
        resources:
          requests:
            cpu: "4"
            memory: "16Gi"
            nvidia.com/gpu: "1"
          limits:
            cpu: "8"
            memory: "32Gi"
            nvidia.com/gpu: "1"
        volumeMounts:
          - name: xnat-archive
            mountPath: /data/xnat/archive
            readOnly: true
          - name: xnat-archive
            mountPath: /data/xnat/archive/AI-POC/resources/output
            subPath: AI-POC/resources/output
    volumes:
      - name: xnat-archive
        persistentVolumeClaim:
          claimName: xnat-archive
