apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: llava-med
  namespace: xnat
  annotations:
    serving.kserve.io/scaleTarget: "3"
    serving.kserve.io/minReplicas: "0"
    serving.kserve.io/scaleMetric: "concurrency"
spec:
  predictor:
    nodeSelector:
      karpenter.sh/nodepool: gpu-ai
    tolerations:
      - key: nvidia.com/gpu
        operator: Equal
        value: "true"
        effect: NoSchedule
      - key: workload.type
        operator: Equal
        value: "ai"
        effect: NoSchedule
    containers:
      - name: llava-med
        image: maxwellthorpe/ai-poc-phase2:0.0.6
        command:
          - "python3"
          - "entrypoint.py"
        args:
          - --handler_type
          - vllm
          - --model_name
          - llava-med
          - --model_dir
          - /data/xnat/archive/AI-POC/resources/ModelWeights/llava-med-v1.5-mistral-7b
          - --dtype
          - bfloat16
          - --max_model_len
          - "4096"
          - --image_size
          - "336"
          - --max_images
          - "1"
        resources:
          requests:
            cpu: "4"
            memory: "16Gi"
            nvidia.com/gpu: "1"
          limits:
            cpu: "8"
            memory: "32Gi"
            nvidia.com/gpu: "1"
        volumeMounts:
          - name: xnat-archive
            mountPath: /data/xnat/archive
            readOnly: true
    volumes:
      - name: xnat-archive
        persistentVolumeClaim:
          claimName: xnat-archive
